name: Ensure Model on CDN (Midnight)

# Mirrors SwiftVoxAlta's registered Qwen3-TTS ComponentDescriptors to the
# intrusive-memory CDN. The matrix mirrors the descriptors in
# Sources/SwiftVoxAlta/VoxAltaModelManager.swift so that Acervo.component(id)
# on the consumer side resolves to a CDN-hosted copy.
#
# Each matrix entry runs `acervo ship`, which performs the full 6-step
# integrity pipeline (HF-LFS SHA-256 verify → zero-byte check → manifest
# round-trip → re-hash vs manifest → CDN manifest fetch verify → CDN
# config.json SHA-256 verify). Idempotent: if the manifest already exists
# on the CDN, the model is skipped.

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC
  workflow_dispatch:

jobs:
  ensure-model-cdn:
    name: Upload Model to CDN
    runs-on: macos-26
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        model:
          - {id: qwen3-tts-base-1.7b,        repo: mlx-community/Qwen3-TTS-12Hz-1.7B-Base-bf16,        slug: mlx-community_Qwen3-TTS-12Hz-1.7B-Base-bf16}
          - {id: qwen3-tts-base-0.6b,        repo: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-bf16,        slug: mlx-community_Qwen3-TTS-12Hz-0.6B-Base-bf16}
          - {id: qwen3-tts-custom-1.7b,      repo: mlx-community/Qwen3-TTS-12Hz-1.7B-CustomVoice-bf16, slug: mlx-community_Qwen3-TTS-12Hz-1.7B-CustomVoice-bf16}
          - {id: qwen3-tts-custom-0.6b,      repo: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-bf16, slug: mlx-community_Qwen3-TTS-12Hz-0.6B-CustomVoice-bf16}
          - {id: qwen3-tts-voicedesign-1.7b, repo: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16, slug: mlx-community_Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16}
          - {id: qwen3-tts-base-1.7b-8bit,   repo: mlx-community/Qwen3-TTS-12Hz-1.7B-Base-8bit,        slug: mlx-community_Qwen3-TTS-12Hz-1.7B-Base-8bit}
          - {id: qwen3-tts-base-1.7b-4bit,   repo: mlx-community/Qwen3-TTS-12Hz-1.7B-Base-4bit,        slug: mlx-community_Qwen3-TTS-12Hz-1.7B-Base-4bit}

    env:
      MODEL_ID: ${{ matrix.model.id }}
      MODEL_REPO: ${{ matrix.model.repo }}
      MODEL_SLUG: ${{ matrix.model.slug }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_PUBLIC_URL: ${{ secrets.CDN_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install acervo CLI
        run: |
          brew tap intrusive-memory/tools
          brew install acervo awscli huggingface-cli
          acervo --version

      - name: Check if model already on CDN
        id: check_cdn
        continue-on-error: true
        run: |
          if acervo verify "$MODEL_REPO" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Model $MODEL_REPO already on CDN — will skip ship"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Model $MODEL_REPO not yet published — will ship"
          fi

      - name: Ship model to CDN
        if: steps.check_cdn.outputs.exists != 'true'
        run: |
          acervo ship "$MODEL_REPO"

      - name: Skip notification
        if: steps.check_cdn.outputs.exists == 'true'
        run: echo "Model $MODEL_ID already on CDN — skipped."

      - name: Success notification
        if: steps.check_cdn.outputs.exists != 'true'
        run: echo "Shipped $MODEL_ID to CDN as $MODEL_SLUG."
